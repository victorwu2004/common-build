name: "Veracode Pipeline Scan (proxy-aware)"
description: >
  Runs a Veracode Pipeline Scan from a self-hosted runner.
  Pipeline Scan's REST API is hosted on api.veracode.com (NOT
  analysiscenter.veracode.com), so when only analysiscenter is directly
  reachable this action routes the JVM through an HTTPS proxy (e.g. Zscaler)
  to reach api.veracode.com. Supports pre-staging the scanner jar from Nexus
  so downloads.veracode.com does not need to be reachable.

inputs:
  vid:
    description: "Veracode API ID (pass via secret)"
    required: true
  vkey:
    description: "Veracode API key (pass via secret)"
    required: true
  file:
    description: "Path to the packaged artifact to scan (zip/jar/war/exe/dll set)"
    required: true
  app-name:
    description: "Project/application name shown in scan output"
    required: false
    default: ${{ github.repository }}
  fail-on-severity:
    description: 'Comma-separated severities to fail on, e.g. "Very High,High"'
    required: false
    default: "Very High,High"
  fail-on-cwe:
    description: "Comma-separated CWE IDs to fail on (optional)"
    required: false
    default: ""
  baseline-file:
    description: "Path to a baseline results.json (optional)"
    required: false
    default: ""
  timeout:
    description: "Max minutes to wait for the scan (Veracode hard cap is 60)"
    required: false
    default: "30"

  # --- Scanner jar acquisition -------------------------------------------
  jar-path:
    description: >
      Path to a pre-staged pipeline-scan.jar. If set and present, no download
      happens. Recommended on locked-down networks (stage it from Nexus).
    required: false
    default: ""
  jar-url:
    description: >
      URL to download pipeline-scan-LATEST.zip from when jar-path is empty.
      Point this at your Nexus raw repo if downloads.veracode.com is blocked.
    required: false
    default: "https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip"

  # --- Proxy (to reach api.veracode.com) ---------------------------------
  proxy-host:
    description: "HTTPS proxy host used to reach api.veracode.com"
    required: false
    default: ""
  proxy-port:
    description: "HTTPS proxy port"
    required: false
    default: ""
  proxy-user:
    description: "Proxy username (if the proxy requires auth)"
    required: false
    default: ""
  proxy-password:
    description: "Proxy password (if the proxy requires auth; pass via secret)"
    required: false
    default: ""

  # --- TLS / Zscaler interception ----------------------------------------
  truststore-path:
    description: >
      Path to a Java truststore (.jks/.p12) that contains your proxy/Zscaler
      root CA. Needed if the proxy does TLS inspection, otherwise the JVM
      throws PKIX path-building errors.
    required: false
    default: ""
  truststore-password:
    description: "Password for the truststore above (pass via secret)"
    required: false
    default: ""

  fail-build:
    description: "Fail the job when findings meet the fail criteria"
    required: false
    default: "true"

outputs:
  results-file:
    description: "Path to results.json"
    value: ${{ steps.scan.outputs.results-file }}
  scan-passed:
    description: "true when the scan returned exit code 0 (no qualifying findings)"
    value: ${{ steps.scan.outputs.scan-passed }}
  exit-code:
    description: "Raw pipeline-scan exit code"
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - name: Resolve pipeline-scan.jar
      id: resolve
      shell: pwsh
      env:
        JAR_PATH: ${{ inputs.jar-path }}
        JAR_URL: ${{ inputs.jar-url }}
        PROXY_HOST: ${{ inputs.proxy-host }}
        PROXY_PORT: ${{ inputs.proxy-port }}
        PROXY_USER: ${{ inputs.proxy-user }}
        PROXY_PASS: ${{ inputs.proxy-password }}
      run: |
        $ErrorActionPreference = "Stop"

        if ($env:JAR_PATH -and (Test-Path $env:JAR_PATH)) {
          Write-Host "Using pre-staged jar: $env:JAR_PATH"
          "jar=$($env:JAR_PATH)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          return
        }

        $work = Join-Path $env:RUNNER_TEMP "veracode-ps"
        New-Item -ItemType Directory -Force -Path $work | Out-Null
        $zip = Join-Path $work "pipeline-scan.zip"

        Write-Host "Downloading scanner from $($env:JAR_URL)"
        $iwr = @{
          Uri             = $env:JAR_URL
          OutFile         = $zip
          UseBasicParsing = $true
        }
        if ($env:PROXY_HOST) {
          $iwr.Proxy = "http://$($env:PROXY_HOST):$($env:PROXY_PORT)"
          if ($env:PROXY_USER) {
            $sec  = ConvertTo-SecureString $env:PROXY_PASS -AsPlainText -Force
            $iwr.ProxyCredential = New-Object System.Management.Automation.PSCredential($env:PROXY_USER, $sec)
          }
        }
        Invoke-WebRequest @iwr

        Expand-Archive -Path $zip -DestinationPath $work -Force
        $jar = (Get-ChildItem -Path $work -Recurse -Filter "pipeline-scan.jar" |
                Select-Object -First 1).FullName
        if (-not $jar) { throw "pipeline-scan.jar not found in downloaded archive." }
        Write-Host "Resolved jar: $jar"
        "jar=$jar" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Run Veracode Pipeline Scan
      id: scan
      shell: pwsh
      env:
        JAR: ${{ steps.resolve.outputs.jar }}
        VID: ${{ inputs.vid }}
        VKEY: ${{ inputs.vkey }}
        FILE: ${{ inputs.file }}
        APP_NAME: ${{ inputs.app-name }}
        FAIL_SEV: ${{ inputs.fail-on-severity }}
        FAIL_CWE: ${{ inputs.fail-on-cwe }}
        BASELINE: ${{ inputs.baseline-file }}
        TIMEOUT: ${{ inputs.timeout }}
        PROXY_HOST: ${{ inputs.proxy-host }}
        PROXY_PORT: ${{ inputs.proxy-port }}
        PROXY_USER: ${{ inputs.proxy-user }}
        PROXY_PASS: ${{ inputs.proxy-password }}
        TRUSTSTORE: ${{ inputs.truststore-path }}
        TRUSTSTORE_PASS: ${{ inputs.truststore-password }}
        FAIL_BUILD: ${{ inputs.fail-build }}
      run: |
        $ErrorActionPreference = "Stop"

        # ---- JVM-level proxy args ---------------------------------------------
        # The JVM does NOT read HTTP_PROXY/HTTPS_PROXY env vars. The scan only
        # goes through the proxy when these -D flags are passed explicitly.
        # Without them, the JVM connects DIRECT to api.veracode.com -> in a
        # locked-down network that hangs and the tool exits 255 (-1).
        $jvm = @()
        if ($env:PROXY_HOST) {
          $jvm += "-Dhttps.proxyHost=$($env:PROXY_HOST)"
          $jvm += "-Dhttps.proxyPort=$($env:PROXY_PORT)"
          $jvm += "-Dhttp.proxyHost=$($env:PROXY_HOST)"
          $jvm += "-Dhttp.proxyPort=$($env:PROXY_PORT)"
          # Never put api.veracode.com in nonProxyHosts, or the call bypasses the proxy.
          $jvm += "-Dhttp.nonProxyHosts="
          if ($env:PROXY_USER) {
            $jvm += "-Dhttps.proxyUser=$($env:PROXY_USER)"
            $jvm += "-Dhttps.proxyPassword=$($env:PROXY_PASS)"
            $jvm += "-Dhttp.proxyUser=$($env:PROXY_USER)"
            $jvm += "-Dhttp.proxyPassword=$($env:PROXY_PASS)"
            # CRITICAL for authenticated proxies: since JDK 8u111, Basic auth over
            # the HTTPS CONNECT tunnel is disabled by default. Re-enable it, or the
            # connection silently hangs (also surfaces as a 255 timeout, not a 407).
            $jvm += "-Djdk.http.auth.tunneling.disabledSchemes="
            $jvm += "-Djdk.http.auth.proxying.disabledSchemes="
          }
        }
        else {
          Write-Host "::warning::No proxy-host supplied. The JVM will connect DIRECT to api.veracode.com. If direct egress is blocked, expect exit code 255 (timeout)."
        }
        if ($env:TRUSTSTORE) {
          $jvm += "-Djavax.net.ssl.trustStore=$($env:TRUSTSTORE)"
          if ($env:TRUSTSTORE_PASS) {
            $jvm += "-Djavax.net.ssl.trustStorePassword=$($env:TRUSTSTORE_PASS)"
          }
        }

        # ---- Pipeline Scan args ----
        $scanArgs = @(
          "-jar", $env:JAR,
          "-vid", $env:VID,
          "-vkey", $env:VKEY,
          "--file", $env:FILE,
          "--project_name", $env:APP_NAME,
          "--timeout", $env:TIMEOUT,
          "--json_output_file", "results.json"
        )
        if ($env:FAIL_SEV) { $scanArgs += @("--fail_on_severity", $env:FAIL_SEV) }
        if ($env:FAIL_CWE) { $scanArgs += @("--fail_on_cwe", $env:FAIL_CWE) }
        if ($env:BASELINE) { $scanArgs += @("--baseline_file", $env:BASELINE) }

        # Echo the JVM flags so you can confirm the proxy actually landed.
        # Mask credential values; keep host/port visible for debugging.
        $shown = $jvm | ForEach-Object {
          $_ -replace '(proxyPassword=).*', '$1***' `
             -replace '(trustStorePassword=).*', '$1***'
        }
        Write-Host "JVM flags: $($shown -join ' ')"
        if (-not ($jvm -match 'proxyHost')) {
          Write-Host "::warning::No -Dhttps.proxyHost in the JVM flags. The scan is going DIRECT."
        }

        Write-Host "Launching pipeline scan (credentials masked)..."
        & java @jvm @scanArgs
        $code = $LASTEXITCODE

        "results-file=results.json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "exit-code=$code"           | Out-File -FilePath $env:GITHUB_OUTPUT -Append

        # 0 = no qualifying findings. 1..200 = number of findings. 255/-1 = the
        # tool failed before completing (connection, TLS, proxy-auth, or creds).
        if ($code -eq 0) {
          "scan-passed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Pipeline Scan passed: no findings at/above fail criteria."
        }
        elseif ($code -eq 255) {
          "scan-passed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "::error::Exit 255: scan did not complete. This is a connection/TLS/proxy-auth/credential failure, NOT a findings result. Check the scanner output above for the exception (UnknownHostException/timeout=proxy not reaching api.veracode.com; SSLHandshakeException/PKIX=truststore; 401=credentials)."
          exit 255
        }
        else {
          "scan-passed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Pipeline Scan exit code: $code ($code findings at/above fail criteria)."
          if ($env:FAIL_BUILD -eq "true") { exit 1 }
        }
