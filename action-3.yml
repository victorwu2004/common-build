name: 'Veracode Sandbox Scan'
description: 'Resolves a free sandbox (or creates one) and runs a Veracode scan'

inputs:
  veracode_api_id:
    description: 'Veracode API ID (HMAC)'
    required: true
  veracode_api_key:
    description: 'Veracode API key (HMAC)'
    required: true
  veracode_app_id:
    description: 'Numeric Veracode application ID'
    required: true
  veracode_app_name:
    description: 'Veracode application name (for uploadandscan)'
    required: true
  sandbox_name_prefix:
    description: 'Prefix for newly-created sandboxes'
    required: false
    default: 'ci-'
  artifact_path:
    description: 'Path to artifact(s) to scan'
    required: true
  fail_on_policy_violation:
    description: 'Fail the workflow if Veracode policy fails'
    required: false
    default: 'true'

outputs:
  sandbox_id:
    description: 'Resolved sandbox ID'
    value: ${{ steps.resolve.outputs.sandbox_id }}
  sandbox_name:
    description: 'Resolved sandbox name'
    value: ${{ steps.resolve.outputs.sandbox_name }}
  created:
    description: 'Whether the sandbox was newly created'
    value: ${{ steps.resolve.outputs.created }}
  scan_failed:
    description: 'Whether the scan failed for non-policy reasons'
    value: ${{ steps.scan.outputs.scan_failed }}

runs:
  using: 'composite'
  steps:

    - name: Resolve sandbox (idle lookup or create)
      id: resolve
      shell: bash
      env:
        # Inputs and secrets become env vars HERE -- not in CLI args.
        # GitHub auto-masks values that came in via `secrets.*`, so anything
        # the script echoes that contains the key gets ***'d in logs.
        VERACODE_API_ID:     ${{ inputs.veracode_api_id }}
        VERACODE_API_KEY:    ${{ inputs.veracode_api_key }}
        VERACODE_APP_ID:     ${{ inputs.veracode_app_id }}
        SANDBOX_NAME_PREFIX: ${{ inputs.sandbox_name_prefix }}
        # GITHUB_RUN_ID is already in the env automatically -- no need to set it
      run: |
        # Action's own files live under $GITHUB_ACTION_PATH
        bash "$GITHUB_ACTION_PATH/scripts/veracode-sandbox-resolve.sh"

    - name: Wait and retry if all sandboxes busy
      if: steps.resolve.outputs.all_busy == 'true'
      shell: bash
      env:
        VERACODE_API_ID:     ${{ inputs.veracode_api_id }}
        VERACODE_API_KEY:    ${{ inputs.veracode_api_key }}
        VERACODE_APP_ID:     ${{ inputs.veracode_app_id }}
        SANDBOX_NAME_PREFIX: ${{ inputs.sandbox_name_prefix }}
      run: |
        echo "::notice::All sandboxes busy, waiting 5min before retry"
        sleep 300
        bash "$GITHUB_ACTION_PATH/scripts/veracode-sandbox-resolve.sh"

    - name: Mask derived sandbox ID (optional)
      shell: bash
      run: |
        # Sandbox IDs aren't secret, but if you want them out of logs:
        # echo "::add-mask::${{ steps.resolve.outputs.sandbox_id }}"
        echo "Resolved: id=${{ steps.resolve.outputs.sandbox_id }} \
              name=${{ steps.resolve.outputs.sandbox_name }} \
              created=${{ steps.resolve.outputs.created }}"

    - name: Run Veracode scan
      id: scan
      shell: bash
      env:
        VERACODE_API_ID:    ${{ inputs.veracode_api_id }}
        VERACODE_API_KEY:   ${{ inputs.veracode_api_key }}
        VERACODE_APP_NAME:  ${{ inputs.veracode_app_name }}
        SANDBOX_ID:         ${{ steps.resolve.outputs.sandbox_id }}
        SANDBOX_NAME:       ${{ steps.resolve.outputs.sandbox_name }}
        ARTIFACT_PATH:      ${{ inputs.artifact_path }}
        FAIL_ON_POLICY:     ${{ inputs.fail_on_policy_violation }}
      run: |
        bash "$GITHUB_ACTION_PATH/scripts/veracode-scan.sh"
