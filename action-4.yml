name: 'Veracode Sandbox Scan'
description: 'Resolves a free sandbox (or creates one) and runs a Veracode scan via the Java wrapper'
author: 'Platform Engineering'

inputs:
  veracode_api_id:
    description: 'Veracode API ID (HMAC). Pass via secrets.*'
    required: true
  veracode_api_key:
    description: 'Veracode API key (HMAC). Pass via secrets.*'
    required: true
  veracode_app_id:
    description: 'Numeric Veracode application ID (from vars.*)'
    required: true
  veracode_app_name:
    description: 'Veracode application name (used by uploadandscan)'
    required: true
  artifact_path:
    description: 'Path or glob to artifact(s) to scan'
    required: true
  sandbox_name_prefix:
    description: 'Prefix for newly-created sandbox names'
    required: false
    default: 'ci-'
  fail_on_policy_violation:
    description: 'Fail the workflow if Veracode policy fails'
    required: false
    default: 'true'
  fail_workflow_on_error:
    description: 'Fail the workflow if the scan errors (vs. just reporting via output)'
    required: false
    default: 'true'
  poll_interval_seconds:
    description: 'How often to poll for scan completion'
    required: false
    default: '60'
  poll_timeout_seconds:
    description: 'Max wait time for scan completion'
    required: false
    default: '3600'
  nexus_wrapper_url:
    description: 'Nexus URL to download the Veracode Java wrapper JAR'
    required: true
  nexus_username:
    description: 'Nexus username for wrapper download'
    required: true
  nexus_password:
    description: 'Nexus password for wrapper download'
    required: true

outputs:
  sandbox_id:
    description: 'Resolved sandbox ID'
    value: ${{ steps.resolve_retry.outputs.sandbox_id || steps.resolve.outputs.sandbox_id }}
  sandbox_name:
    description: 'Resolved sandbox name'
    value: ${{ steps.resolve_retry.outputs.sandbox_name || steps.resolve.outputs.sandbox_name }}
  sandbox_created:
    description: 'true if a new sandbox was created, false if reused'
    value: ${{ steps.resolve_retry.outputs.created || steps.resolve.outputs.created }}
  build_id:
    description: 'Veracode build ID for cross-referencing'
    value: ${{ steps.scan.outputs.build_id }}
  scan_failed:
    description: 'true if the scan errored (NOT a policy violation)'
    value: ${{ steps.scan.outputs.scan_failed }}
  policy_violation:
    description: 'true if scan completed but policy failed'
    value: ${{ steps.scan.outputs.policy_violation }}

runs:
  using: 'composite'
  steps:

    # ----------------------------------------------------------------------
    # Step 1: Pull the wrapper JAR from Nexus (source of truth)
    # ----------------------------------------------------------------------
    - name: Download Veracode wrapper JAR from Nexus
      shell: bash
      env:
        NEXUS_URL:      ${{ inputs.nexus_wrapper_url }}
        NEXUS_USERNAME: ${{ inputs.nexus_username }}
        NEXUS_PASSWORD: ${{ inputs.nexus_password }}
      run: |
        set -euo pipefail
        echo "::add-mask::${NEXUS_PASSWORD}"
        echo "::group::Downloading Veracode wrapper JAR"
        curl --silent --fail --show-error \
          -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
          -o "${RUNNER_TEMP}/VeracodeJavaAPI.jar" \
          "${NEXUS_URL}"

        if [[ ! -s "${RUNNER_TEMP}/VeracodeJavaAPI.jar" ]]; then
          echo "::error::Wrapper JAR download empty or failed"
          exit 1
        fi
        echo "Downloaded $(du -h "${RUNNER_TEMP}/VeracodeJavaAPI.jar" | cut -f1) wrapper JAR"
        echo "::endgroup::"

    # ----------------------------------------------------------------------
    # Step 2: Resolve sandbox -- find idle one or create new
    # ----------------------------------------------------------------------
    - name: Resolve sandbox (idle lookup or create)
      id: resolve
      shell: bash
      env:
        VERACODE_API_KEY_ID:     ${{ inputs.veracode_api_id }}
        VERACODE_API_KEY_SECRET: ${{ inputs.veracode_api_key }}
        VERACODE_APP_ID:         ${{ inputs.veracode_app_id }}
        VERACODE_APP_NAME:       ${{ inputs.veracode_app_name }}
        SANDBOX_NAME_PREFIX:     ${{ inputs.sandbox_name_prefix }}
      run: bash "$GITHUB_ACTION_PATH/scripts/veracode-sandbox-resolve.sh"

    # ----------------------------------------------------------------------
    # Step 3: If all 10 sandboxes busy, wait once and retry
    # ----------------------------------------------------------------------
    - name: Wait and retry if all sandboxes busy
      id: resolve_retry
      if: steps.resolve.outputs.all_busy == 'true'
      shell: bash
      env:
        VERACODE_API_KEY_ID:     ${{ inputs.veracode_api_id }}
        VERACODE_API_KEY_SECRET: ${{ inputs.veracode_api_key }}
        VERACODE_APP_ID:         ${{ inputs.veracode_app_id }}
        VERACODE_APP_NAME:       ${{ inputs.veracode_app_name }}
        SANDBOX_NAME_PREFIX:     ${{ inputs.sandbox_name_prefix }}
      run: |
        echo "::warning::All sandboxes busy. Waiting 5min before retry..."
        sleep 300
        bash "$GITHUB_ACTION_PATH/scripts/veracode-sandbox-resolve.sh"

    # ----------------------------------------------------------------------
    # Step 4: Run the scan against the resolved sandbox
    # ----------------------------------------------------------------------
    - name: Run Veracode sandbox scan
      id: scan
      shell: bash
      env:
        VERACODE_API_KEY_ID:     ${{ inputs.veracode_api_id }}
        VERACODE_API_KEY_SECRET: ${{ inputs.veracode_api_key }}
        VERACODE_APP_ID:         ${{ inputs.veracode_app_id }}
        VERACODE_APP_NAME:       ${{ inputs.veracode_app_name }}
        SANDBOX_ID:              ${{ steps.resolve_retry.outputs.sandbox_id || steps.resolve.outputs.sandbox_id }}
        SANDBOX_NAME:            ${{ steps.resolve_retry.outputs.sandbox_name || steps.resolve.outputs.sandbox_name }}
        ARTIFACT_PATH:           ${{ inputs.artifact_path }}
        FAIL_ON_POLICY:          ${{ inputs.fail_on_policy_violation }}
        FAIL_WORKFLOW_ON_ERROR:  ${{ inputs.fail_workflow_on_error }}
        POLL_INTERVAL_SECONDS:   ${{ inputs.poll_interval_seconds }}
        POLL_TIMEOUT_SECONDS:    ${{ inputs.poll_timeout_seconds }}
      run: bash "$GITHUB_ACTION_PATH/scripts/veracode-scan.sh"

    # ----------------------------------------------------------------------
    # Step 5: Job Summary -- always runs, even on scan failure
    # ----------------------------------------------------------------------
    - name: Write Job Summary
      if: always()
      shell: bash
      env:
        SANDBOX_ID:        ${{ steps.resolve_retry.outputs.sandbox_id || steps.resolve.outputs.sandbox_id }}
        SANDBOX_NAME:      ${{ steps.resolve_retry.outputs.sandbox_name || steps.resolve.outputs.sandbox_name }}
        SANDBOX_CREATED:   ${{ steps.resolve_retry.outputs.created || steps.resolve.outputs.created }}
        BUILD_ID:          ${{ steps.scan.outputs.build_id }}
        SCAN_FAILED:       ${{ steps.scan.outputs.scan_failed }}
        POLICY_VIOLATION:  ${{ steps.scan.outputs.policy_violation }}
        APP_NAME:          ${{ inputs.veracode_app_name }}
      run: |
        {
          echo "## Veracode Sandbox Scan"
          echo ""
          echo "| Field | Value |"
          echo "|---|---|"
          echo "| Application | \`${APP_NAME}\` |"
          echo "| Sandbox | \`${SANDBOX_NAME:-?}\` (id: \`${SANDBOX_ID:-?}\`) |"
          echo "| Sandbox source | $([ "$SANDBOX_CREATED" = "true" ] && echo 'newly created' || echo 'reused idle') |"
          echo "| Build ID | \`${BUILD_ID:-n/a}\` |"
          echo "| Scan errored | ${SCAN_FAILED:-unknown} |"
          echo "| Policy violation | ${POLICY_VIOLATION:-unknown} |"
        } >> "$GITHUB_STEP_SUMMARY"
