name: "Veracode Pipeline Scan (proxy-aware, Linux/bash)"
description: >
  Runs a Veracode Pipeline Scan from a self-hosted Linux runner.
  Pipeline Scan's REST API is on api.veracode.com (NOT analysiscenter.veracode.com),
  so when only analysiscenter is directly reachable this routes the JVM through an
  HTTPS proxy (e.g. Zscaler) to reach api.veracode.com. The JVM does not read
  HTTP(S)_PROXY env vars, so the proxy is wired in via explicit -D flags.

inputs:
  vid:
    description: "Veracode API ID (pass via secret)"
    required: true
  vkey:
    description: "Veracode API key (pass via secret)"
    required: true
  file:
    description: "Path to the packaged artifact to scan (zip/jar/war/etc.)"
    required: true
  app-name:
    description: "Project/application name shown in scan output"
    required: false
    default: ${{ github.repository }}
  fail-on-severity:
    description: 'Comma-separated severities to fail on, e.g. "Very High,High"'
    required: false
    default: "Very High,High"
  fail-on-cwe:
    description: "Comma-separated CWE IDs to fail on (optional)"
    required: false
    default: ""
  baseline-file:
    description: "Path to a baseline results.json (optional)"
    required: false
    default: ""
  timeout:
    description: "Max minutes to wait for the scan (Veracode hard cap is 60)"
    required: false
    default: "30"

  # --- Scanner jar acquisition ------------------------------------------------
  jar-path:
    description: >
      Path to a pre-staged pipeline-scan.jar. If set and present, no download
      happens. Recommended on locked-down networks (stage it from Nexus).
    required: false
    default: ""
  jar-url:
    description: >
      URL to download pipeline-scan-LATEST.zip when jar-path is empty.
      Point at your Nexus raw repo if downloads.veracode.com is blocked.
    required: false
    default: "https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip"

  # --- Proxy (to reach api.veracode.com) --------------------------------------
  proxy-host:
    description: "HTTPS proxy host used to reach api.veracode.com"
    required: false
    default: ""
  proxy-port:
    description: "HTTPS proxy port"
    required: false
    default: ""
  proxy-user:
    description: "Proxy username (if the proxy requires auth)"
    required: false
    default: ""
  proxy-password:
    description: "Proxy password (if the proxy requires auth; pass via secret)"
    required: false
    default: ""

  # --- TLS / Zscaler interception ---------------------------------------------
  truststore-path:
    description: >
      Path to a Java truststore (.jks/.p12) containing your proxy/Zscaler root CA.
      Needed if the proxy does TLS inspection, else the JVM throws PKIX errors.
    required: false
    default: ""
  truststore-password:
    description: "Password for the truststore above (pass via secret)"
    required: false
    default: ""

  fail-build:
    description: "Fail the job when findings meet the fail criteria"
    required: false
    default: "true"

outputs:
  results-file:
    description: "Path to results.json"
    value: ${{ steps.scan.outputs.results-file }}
  scan-passed:
    description: "true when the scan returned exit code 0 (no qualifying findings)"
    value: ${{ steps.scan.outputs.scan-passed }}
  exit-code:
    description: "Raw pipeline-scan exit code"
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - name: Resolve pipeline-scan.jar
      id: resolve
      shell: bash
      env:
        JAR_PATH: ${{ inputs.jar-path }}
        JAR_URL: ${{ inputs.jar-url }}
        PROXY_HOST: ${{ inputs.proxy-host }}
        PROXY_PORT: ${{ inputs.proxy-port }}
        PROXY_USER: ${{ inputs.proxy-user }}
        PROXY_PASS: ${{ inputs.proxy-password }}
      run: |
        set -euo pipefail

        if [[ -n "${JAR_PATH}" && -f "${JAR_PATH}" ]]; then
          echo "Using pre-staged jar: ${JAR_PATH}"
          echo "jar=${JAR_PATH}" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        work="${RUNNER_TEMP}/veracode-ps"
        mkdir -p "${work}"
        zip="${work}/pipeline-scan.zip"

        echo "Downloading scanner from ${JAR_URL}"
        curl_args=(-fSL --retry 3 -o "${zip}")
        if [[ -n "${PROXY_HOST}" ]]; then
          curl_args+=(-x "http://${PROXY_HOST}:${PROXY_PORT}")
          if [[ -n "${PROXY_USER}" ]]; then
            curl_args+=(--proxy-user "${PROXY_USER}:${PROXY_PASS}")
          fi
        fi
        curl "${curl_args[@]}" "${JAR_URL}"

        unzip -o -q "${zip}" -d "${work}"
        jar="$(find "${work}" -name 'pipeline-scan.jar' | head -n1)"
        if [[ -z "${jar}" ]]; then
          echo "::error::pipeline-scan.jar not found in downloaded archive."
          exit 1
        fi
        echo "Resolved jar: ${jar}"
        echo "jar=${jar}" >> "${GITHUB_OUTPUT}"

    - name: Run Veracode Pipeline Scan
      id: scan
      shell: bash
      env:
        JAR: ${{ steps.resolve.outputs.jar }}
        VID: ${{ inputs.vid }}
        VKEY: ${{ inputs.vkey }}
        FILE: ${{ inputs.file }}
        APP_NAME: ${{ inputs.app-name }}
        FAIL_SEV: ${{ inputs.fail-on-severity }}
        FAIL_CWE: ${{ inputs.fail-on-cwe }}
        BASELINE: ${{ inputs.baseline-file }}
        TIMEOUT: ${{ inputs.timeout }}
        PROXY_HOST: ${{ inputs.proxy-host }}
        PROXY_PORT: ${{ inputs.proxy-port }}
        PROXY_USER: ${{ inputs.proxy-user }}
        PROXY_PASS: ${{ inputs.proxy-password }}
        TRUSTSTORE: ${{ inputs.truststore-path }}
        TRUSTSTORE_PASS: ${{ inputs.truststore-password }}
        FAIL_BUILD: ${{ inputs.fail-build }}
      run: |
        set -uo pipefail

        # ---- JVM-level proxy args -------------------------------------------
        # The JVM ignores HTTP_PROXY/HTTPS_PROXY env vars. The scan only goes
        # through the proxy when these -D flags are passed explicitly. Without
        # them the JVM connects DIRECT to api.veracode.com; in a locked-down
        # network that hangs and the tool exits 255 (-1).
        jvm=()
        if [[ -n "${PROXY_HOST}" ]]; then
          jvm+=("-Dhttps.proxyHost=${PROXY_HOST}" "-Dhttps.proxyPort=${PROXY_PORT}")
          jvm+=("-Dhttp.proxyHost=${PROXY_HOST}"  "-Dhttp.proxyPort=${PROXY_PORT}")
          # Never put api.veracode.com in nonProxyHosts, or the call bypasses the proxy.
          jvm+=("-Dhttp.nonProxyHosts=")
          if [[ -n "${PROXY_USER}" ]]; then
            jvm+=("-Dhttps.proxyUser=${PROXY_USER}" "-Dhttps.proxyPassword=${PROXY_PASS}")
            jvm+=("-Dhttp.proxyUser=${PROXY_USER}"  "-Dhttp.proxyPassword=${PROXY_PASS}")
            # CRITICAL for authenticated proxies: since JDK 8u111 Basic auth over
            # the HTTPS CONNECT tunnel is disabled by default. Re-enable it or the
            # connection silently hangs (also surfaces as a 255 timeout, not 407).
            jvm+=("-Djdk.http.auth.tunneling.disabledSchemes=")
            jvm+=("-Djdk.http.auth.proxying.disabledSchemes=")
          fi
        else
          echo "::warning::No proxy-host supplied. The JVM will connect DIRECT to api.veracode.com. If direct egress is blocked, expect exit code 255 (timeout)."
        fi
        if [[ -n "${TRUSTSTORE}" ]]; then
          jvm+=("-Djavax.net.ssl.trustStore=${TRUSTSTORE}")
          [[ -n "${TRUSTSTORE_PASS}" ]] && jvm+=("-Djavax.net.ssl.trustStorePassword=${TRUSTSTORE_PASS}")
        fi

        # ---- Pipeline Scan args ---------------------------------------------
        scan=(-jar "${JAR}" -vid "${VID}" -vkey "${VKEY}" \
              --file "${FILE}" --project_name "${APP_NAME}" \
              --timeout "${TIMEOUT}" --json_output_file results.json)
        [[ -n "${FAIL_SEV}" ]] && scan+=(--fail_on_severity "${FAIL_SEV}")
        [[ -n "${FAIL_CWE}" ]] && scan+=(--fail_on_cwe "${FAIL_CWE}")
        [[ -n "${BASELINE}" ]] && scan+=(--baseline_file "${BASELINE}")

        # Echo JVM flags (mask credential values, keep host/port visible).
        shown="$(printf '%s ' "${jvm[@]}" | sed -E 's/(proxyPassword=)[^ ]*/\1***/g; s/(trustStorePassword=)[^ ]*/\1***/g')"
        echo "JVM flags: ${shown}"
        if [[ "${shown}" != *"proxyHost"* && -n "${PROXY_HOST}" ]]; then
          echo "::warning::Proxy host set but no -Dhttps.proxyHost in flags — check inputs."
        fi

        echo "Launching pipeline scan (credentials masked)..."
        # Capture exit code without tripping errexit.
        java "${jvm[@]}" "${scan[@]}" && code=0 || code=$?

        echo "results-file=results.json" >> "${GITHUB_OUTPUT}"
        echo "exit-code=${code}"         >> "${GITHUB_OUTPUT}"

        # 0 = no qualifying findings. 1..200 = number of findings. 255/-1 = the
        # tool failed before completing (connection, TLS, proxy-auth, or creds).
        if [[ "${code}" -eq 0 ]]; then
          echo "scan-passed=true" >> "${GITHUB_OUTPUT}"
          echo "Pipeline Scan passed: no findings at/above fail criteria."
        elif [[ "${code}" -eq 255 ]]; then
          echo "scan-passed=false" >> "${GITHUB_OUTPUT}"
          echo "::error::Exit 255: scan did not complete. This is a connection/TLS/proxy-auth/credential failure, NOT a findings result. Check the scanner output above (UnknownHostException/timeout=proxy not reaching api.veracode.com; SSLHandshakeException/PKIX=truststore; 401=credentials)."
          exit 255
        else
          echo "scan-passed=false" >> "${GITHUB_OUTPUT}"
          echo "Pipeline Scan exit code: ${code} (${code} findings at/above fail criteria)."
          [[ "${FAIL_BUILD}" == "true" ]] && exit 1 || true
        fi
